services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://horizonte:horizonte@db:5432/horizonte_saude
      # Hardcoded (não via ${ACCESSCORE_URL} do .env): o .env tem o valor visto
      # do HOST (localhost:8000) para uso com `npm run dev`/testes fora do
      # Docker. Dentro do container, "localhost" seria o próprio container, não
      # o host — por isso o valor aqui precisa ser explicitamente diferente.
      ACCESSCORE_URL: http://host.docker.internal:8000/api/v1
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horizonte
      POSTGRES_PASSWORD: horizonte
      POSTGRES_DB: horizonte_saude
    ports:
      - '5434:5432'
    volumes:
      - horizonte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U horizonte -d horizonte_saude']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  horizonte_pgdata:
