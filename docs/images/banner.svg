<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ClinicFlow — Multi-tenant Clinic Scheduling Platform">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" />

  <!-- subtle grid dots -->
  <g fill="#38bdf8" opacity="0.12">
    <circle cx="80" cy="60" r="2.5" />
    <circle cx="140" cy="60" r="2.5" />
    <circle cx="200" cy="60" r="2.5" />
    <circle cx="80" cy="120" r="2.5" />
    <circle cx="140" cy="120" r="2.5" />
    <circle cx="1080" cy="220" r="2.5" />
    <circle cx="1120" cy="220" r="2.5" />
    <circle cx="1120" cy="260" r="2.5" />
  </g>

  <!-- pulse / calendar mark -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="72" height="72" rx="14" fill="url(#accent)" opacity="0.15" />
    <rect x="14" y="14" width="44" height="44" rx="6" fill="none" stroke="url(#accent)" stroke-width="3" />
    <path d="M14 30 H28 L33 20 L40 42 L46 30 H58" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="180" y="150" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">ClinicFlow</text>
  <text x="182" y="188" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Multi-tenant Clinic Scheduling Platform</text>

  <rect x="182" y="210" width="640" height="3" rx="1.5" fill="url(#accent)" opacity="0.6" />
</svg>
